# Server Configuration
server:
  port: 8083

spring:
  application:
    name: group-service

  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/groups_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Liquibase
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true

# JWT Configuration (aligned with auth-service)
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
  issuer: quiz-auth-service
  audience: quiz-application
  cookie:
    name: token
    max-age: 604800 # 7 days in seconds (7 * 24 * 60 * 60)
    http-only: true
    secure: ${JWT_COOKIE_SECURE:false} # Set to true in production (HTTPS only)
    same-site: Strict # Strict, Lax, or None
    path: /

# Question Service Integration
question:
  service:
    url: ${QUESTION_SERVICE_URL:http://localhost:8082}

# Eureka Client (optional)
eureka:
  client:
    enabled: ${EUREKA_ENABLED:false}
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true

# Application Info
info:
  app:
    name: group-service
    description: Group management service
    version: 0.0.1-SNAPSHOT

# OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
