databaseChangeLog:
  - changeSet:
      id: 003-create-group-invitations-table
      author: system
      changes:
        - createTable:
            tableName: group_invitations
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: group_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: invited_by
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: invitee_email
                  type: VARCHAR(255)
              - column:
                  name: invitee_user_id
                  type: BIGINT
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: token
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: responded_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: group_invitations
            baseColumnNames: group_id
            constraintName: fk_group_invitations_group
            referencedTableName: groups
            referencedColumnNames: id
            onDelete: CASCADE

        - addCheckConstraint:
            tableName: group_invitations
            constraintName: chk_invitation_status
            checkCondition: "status IN ('PENDING', 'ACCEPTED', 'DECLINED', 'EXPIRED')"

        - addCheckConstraint:
            tableName: group_invitations
            constraintName: chk_invitee_identifier
            checkCondition: "invitee_email IS NOT NULL OR invitee_user_id IS NOT NULL"

        - createIndex:
            tableName: group_invitations
            indexName: idx_invitations_token
            columns:
              - column:
                  name: token

        - createIndex:
            tableName: group_invitations
            indexName: idx_invitations_email
            columns:
              - column:
                  name: invitee_email

        - createIndex:
            tableName: group_invitations
            indexName: idx_invitations_user
            columns:
              - column:
                  name: invitee_user_id

        - createIndex:
            tableName: group_invitations
            indexName: idx_invitations_group
            columns:
              - column:
                  name: group_id
              - column:
                  name: status
